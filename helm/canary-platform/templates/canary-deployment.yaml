apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.canary.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.canary.replicas }}
  selector:
    matchLabels:
      app: canary-demo
      version: {{ .Values.canary.version }}
  template:
    metadata:
      labels:
        app: canary-demo
        version: {{ .Values.canary.version }}
    spec:
      containers:
        - name: canary
          image: {{ .Values.canary.image }}
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
