apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: canary-destination
  namespace: canary-demo
spec:
  host: app-service.canary-demo.svc.cluster.local
  subsets:
    - name: stable
      labels:
        version: stable
    - name: canary
      labels:
        version: canary
